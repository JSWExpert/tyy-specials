<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>:root{--teal:#5BBFAD;--teal-deep:#1F6F66;--ink:#1C3E3A;--ink2:#4A6B66;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#e4eaec}html,body{margin:0}
body{max-width:480px;margin:0 auto;background:#F1F5F6;color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;box-shadow:0 0 40px rgba(120,70,20,.15)}
.emb body{overflow-y:hidden}
a{color:inherit;text-decoration:none}
h2,h3{margin:0}
.hd{text-align:center;padding:0 16px;margin-bottom:14px}
.eb{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#5f6f77}
.hd h2{font-family:var(--serif);font-weight:600;font-size:31px;color:#143F3A;line-height:1.05;margin-top:6px}
.hd p{margin:8px 0 0;font-size:13px;color:#4f6068}
.btn{display:block;text-align:center;font-weight:500;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;padding:13px 12px;border-radius:999px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:6px 16px 14px;scroll-padding:0 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.dots{display:flex;justify-content:center;gap:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(31,111,102,.25);transition:all .25s}
.dots i.on{background:var(--teal-deep);width:18px;border-radius:6px}
/* weekly */
.wk{position:relative;padding:30px 0 22px;background:linear-gradient(rgba(246,249,250,.78),rgba(236,242,244,.6)),url(img/bg.jpg) center/cover}
.c{all:unset;box-sizing:border-box;flex:0 0 70%;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:6px;min-height:215px;padding:18px 16px 16px;cursor:pointer;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(226,234,238,.78));border:1px solid rgba(176,188,196,.75);border-radius:20px;box-shadow:0 12px 28px rgba(90,110,120,.20),inset 0 1px 0 rgba(255,255,255,.85)}
.c .d{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#6b7b83;font-weight:500}
.c .t{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.08;color:#1d2d2a;margin-top:4px}
.c .o{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1;color:var(--teal-deep);margin-top:auto}
.c .h{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#3d4f56}
.c.p{opacity:.55}
.wk .dots{margin-top:2px}
/* memberships */
.mb{position:relative;padding:32px 0 24px;color:#fff;background:linear-gradient(165deg,#133C37,#1F6F66 70%,#2a8a7e)}
.mb .eb{color:#DCE3E7}.mb .hd h2{color:#fff}.mb .hd p{color:#d6efe9}
.card{flex:0 0 80%;scroll-snap-align:center;display:flex;flex-direction:column;padding:20px 18px 18px;background:rgba(255,255,255,.09);border:1px solid rgba(225,232,236,.55);border-radius:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card .n{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.05}
.card .p{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;margin-top:8px;color:#E6ECEF}
.card .p small{font-family:var(--sans);font-size:13px;font-weight:300;letter-spacing:.06em;color:#d6efe9}
.card .tg{font-size:13.5px;color:#d6efe9;margin:8px 0 4px;min-height:54px}
.card ul{list-style:none;margin:8px 0 14px;padding:0;display:grid;gap:8px;flex:1}
.card li{position:relative;padding-left:24px;font-size:14px}
.card li:before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2px solid #DCE3E7;border-bottom:2px solid #DCE3E7;transform:rotate(-45deg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel{display:block;text-align:center;font-weight:500;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;padding:13px 10px;border-radius:999px;background:linear-gradient(135deg,#ffffff 0%,#d5dce0 28%,#9aa5ad 52%,#eef2f4 74%,#b4bec5 100%);color:#15302d}
.more{all:unset;box-sizing:border-box;text-align:center;cursor:pointer;font-weight:500;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;padding:13px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.7);color:#fff}
.mb .dots i{background:rgba(255,255,255,.3)}.mb .dots i.on{background:#E6ECEF}
/* panels */
.panel{display:none;position:absolute;left:12px;right:12px;top:88px;z-index:8;max-height:480px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 18px 18px;background:#FBFDFD;color:var(--ink);border:1px solid rgba(176,188,196,.75);border-radius:18px;box-shadow:0 16px 40px rgba(60,30,0,.28)}
.panel.on{display:block}
.panel .x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:0;background:#F1F5F6;color:var(--teal-deep);font-size:18px;line-height:1}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;margin:0 34px 4px 0;line-height:1.1}
.panel .d{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#6b7b83;font-weight:500}
.panel .of{font-family:var(--serif);font-size:22px;color:var(--teal-deep);font-weight:600;margin:4px 0 6px}
.panel .ds{font-size:14.5px;color:var(--ink2);margin:0 0 14px}
.panel .pp{font-family:var(--serif);font-size:20px;color:var(--teal-deep);margin:0 0 10px}
.panel ul{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.panel li{position:relative;padding-left:22px;font-size:14.5px}
.panel li:before{content:"";position:absolute;left:2px;top:.45em;width:10px;height:6px;border-left:2px solid var(--teal-deep);border-bottom:2px solid var(--teal-deep);transform:rotate(-45deg)}
.panel .bk,.panel .sel{display:block;text-align:center;background:linear-gradient(135deg,#2F9486,#1F6F66);color:#fff;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:13.5px;padding:13px;border-radius:999px}
.wk{min-height:400px}.mb{min-height:560px}
</style></head><body>
<section class="wk">
 <div class="hd"><div class="eb">Every week</div><h2>Weekly Specials</h2><p>Recurring offers, no code needed. Tap one for details.</p></div>
 <div class="rail" id="wr"></div><div class="dots" id="wd"></div>
 <div class="panel" id="wp"><button class="x" aria-label="Close">&times;</button><div id="wb"></div></div>
</section>

<script>

d)", "50% off of urinary incontinence services", "50% off of the O-Shot", "50% off of the Heightened Pleasure Injections", "50% off of PRF/PRP injections", "50% off of PRF bio filler services", "50% off of hair restoration services", "$50 birthday gift card", "1 complimentary Bronze, Bronze+, Silver item (valued $0\u2013$199)", "5% off medical-grade skincare", "1 Family & Friends Buddy Pass", "Priority scheduling & invitations to members-only events"]}];
var FALLBACK=[
 {day:'Every Tuesday',title:'20% Tuesdays',offer:'20% off all HA Filler',description:'Every Tuesday, all Hyaluronic Acid filler treatments are automatically 20% off. No code needed.'},
 {day:'Every Wednesday',title:'Signature Service Wednesdays',offer:'$200 off + 50% off add-ons',description:'Every Wednesday, save $200 on any signature service and get 50% off all add-ons.'},

 {day:'Every Saturday',title:'Myers Cocktail Saturdays',offer:'Myers Cocktail $99 + 50% off all boosters',description:'Every Saturday, get the Myers Cocktail for $99 and all boosters at 50% off.'}];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function $(i){return document.getElementById(i)}
function dotsFor(rail,dots){dots.innerHTML=[].map.call(rail.children,function(){return '<i></i>'}).join('');var ds=dots.children;
 function upd(){var c=rail.children,mid=rail.scrollLeft+rail.clientWidth/2,b=0,bd=1e9;for(var i=0;i<c.length;i++){var d=Math.abs(c[i].offsetLeft+c[i].offsetWidth/2-mid);if(d<bd){bd=d;b=i}}if(rail.scrollLeft<4)b=0;for(var j=0;j<ds.length;j++)ds[j].className=j===b?'on':''}
 rail.onscroll=upd;upd();}
var list=[],got=false;

 $('wr').innerHTML=items.map(function(s,i){return '<button type="button" class="c'+(s.paused?' p':'')+'" data-i="'+i+'"><span class="d">'+esc(s.day)+'</span><span class="t">'+esc(s.title)+'</span><span class="o">'+esc(s.offer)+'</span><span class="h">Tap for details</span></button>'}).join('');
 dotsFor($('wr'),$('wd'));}
render(FALLBACK);got=false;
window.addEventListener('message',function(e){var s=e.data;if(Array.isArray(s)&&s.length)render(s)});
$('wr').addEventListener('click',function(e){var c=e.target.closest('.c');if(!c)return;var s=list[+c.getAttribute('data-i')];if(!s)return;
 $('wb').innerHTML='<div class="d">'+esc(s.day)+'</div><h3>'+esc(s.title)+'</h3><p class="of">'+esc(s.offer)+'</p><p class="ds">'+esc(s.description)+'</p><a class="bk" href="'+BOOK+'" target="_top">Book my appointment</a>';
 $('wp').classList.add('on')});
$('mr').innerHTML=P.map(function(p,i){return '<div class="card"><div class="n">'+esc(p.name)+'</div><div class="p">$'+p.price+' <small>per month</small></div><div class="tg">'+esc(p.tag)+'</div><ul>'+p.top.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><div class="row"><a class="sel" href="'+p.url+'" target="_top">Select</a><button class="more" data-i="'+i+'">All perks</button></div></div>'}).join('');
dotsFor($('mr'),$('md'));
$('mr').addEventListener('click',function(e){var m=e.target.closest('.more');if(!m)return;var p=P[+m.getAttribute('data-i')];
 $('mbd').innerHTML='<h3>'+esc(p.name)+'</h3><div class="pp">$'+p.price+' per month</div><ul>'+p.all.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><a class="sel" href="'+p.url+'" target="_top">Select</a>';
 $('mp').classList.add('on')});
[].forEach.call(document.querySelectorAll('.panel .x'),function(b){b.addEventListener('click',function(){b.parentNode.classList.remove('on')})});
})();
</script></body></html>
